name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret with Account > Cloudflare Pages > Edit permission."
            exit 1
          fi

      - name: Prepare static website
        run: |
          mkdir -p site
          cp index.html site/
          cp -R articles assets wisdom-ball site/
          cp .nojekyll site/

      - name: Deploy production website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4b76f279b473130ed14284e180a7b48d
          command: pages deploy site --project-name=wuweilab --branch=main
