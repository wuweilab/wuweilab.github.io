<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" role="img" aria-labelledby="title desc"><title id="title">吸引力来自关注点不断更新</title><desc id="desc">横轴为讲述推进，纵轴为继续参与的意愿。曲线仅为创作示意，不代表测量数据或统一反应。</desc>
<rect width="400" height="660" rx="16" fill="#F9F6EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#806B48"/></marker><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78E62" stop-opacity=".20"/><stop offset="1" stop-color="#A78E62" stop-opacity="0"/></linearGradient></defs>
<text x="24" y="38" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#292620">吸引力来自关注点的更新</text>
<text x="24" y="65" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#746E65">创作示意，非实测数据</text>
<line x1="42" y1="145" x2="375" y2="145" stroke="#D4CBBD" stroke-width="2"/>
<line x1="42" y1="225" x2="375" y2="225" stroke="#D4CBBD" stroke-width="2"/>
<line x1="42" y1="305" x2="375" y2="305" stroke="#D4CBBD" stroke-width="2"/>
<line x1="42" y1="105" x2="42" y2="315" stroke="#746E65" stroke-width="2"/>
<line x1="42" y1="315" x2="375" y2="315" stroke="#746E65" stroke-width="2"/>
<text x="47" y="100" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">继续参与的意愿</text>
<path d="M 52 255 C 81.0 255, 81.0 205, 110 205 C 139.0 205, 139.0 123, 168 123 C 197.0 123, 197.0 202, 226 202 C 255.0 202, 255.0 142, 284 142 C 313.0 142, 313.0 250, 342 250 L 342 315 L 52 315 Z" fill="url(#fade)"/>
<path d="M 52 255 C 81.0 255, 81.0 205, 110 205 C 139.0 205, 139.0 123, 168 123 C 197.0 123, 197.0 202, 226 202 C 255.0 202, 255.0 142, 284 142 C 313.0 142, 313.0 250, 342 250" fill="none" stroke="#806B48" stroke-width="4"/>
<circle cx="52" cy="255" r="12" fill="#806B48"/>
<text x="52" y="260" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="110" cy="205" r="12" fill="#806B48"/>
<text x="110" y="210" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="168" cy="123" r="12" fill="#806B48"/>
<text x="168" y="128" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="226" cy="202" r="12" fill="#806B48"/>
<text x="226" y="207" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">4</text>
<circle cx="284" cy="142" r="12" fill="#806B48"/>
<text x="284" y="147" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">5</text>
<circle cx="342" cy="250" r="12" fill="#806B48"/>
<text x="342" y="255" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="375" y="344" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#746E65">讲述推进 →</text>
<text x="24" y="392" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">1  遭遇风暴</text>
<text x="24" y="417" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">能否安全返回</text>
<text x="208" y="392" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">2  问是否相信</text>
<text x="208" y="417" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">他准备做什么</text>
<text x="24" y="469" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">3  孩子落水</text>
<text x="24" y="494" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">为什么这样做</text>
<text x="208" y="469" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">4  父亲跳下</text>
<text x="208" y="494" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">他们怎么办</text>
<text x="24" y="546" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">5  船沉没</text>
<text x="24" y="571" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">能否等到救援</text>
<text x="208" y="546" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#806B48">6  获救与解释</text>
<text x="208" y="571" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">理解父亲的决定</text>
<text x="24" y="639" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">情绪强度、危险程度与吸引力并不等同。</text>
</svg>
