<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="title desc">
  <title id="title">故事推进中的吸引力曲线</title>
  <desc id="desc">吸引力随着风暴、追问、落水、同行、沉船和获救六个节点起伏。</desc>
  <rect width="400" height="380" rx="16" fill="#F9F6EF"/>
  <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C65F4B" stop-opacity=".16"/><stop offset="1" stop-color="#C65F4B" stop-opacity="0"/></linearGradient></defs>
  <text x="22" y="40" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="300" fill="#292620">故事推进中的吸引力</text>
  <text x="22" y="66" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="12" font-weight="300" fill="#746E65">关注点改变，阅读理由也随之改变</text>
  <line x1="34" y1="275" x2="368" y2="275" stroke="#D4CBBD" stroke-width="1"/>
  <path d="M44 234 C72 234 72 204 100 204 S128 119 156 119 S184 205 212 205 S240 142 268 142 S296 230 324 230" fill="none" stroke="#C65F4B" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 234 C72 234 72 204 100 204 S128 119 156 119 S184 205 212 205 S240 142 268 142 S296 230 324 230 L324 275 L44 275 Z" fill="url(#area)"/>
  <g fill="#4F6673" stroke="#F9F6EF" stroke-width="3"><circle cx="44" cy="234" r="7"/><circle cx="100" cy="204" r="7"/><circle cx="156" cy="119" r="7"/><circle cx="212" cy="205" r="7"/><circle cx="268" cy="142" r="7"/><circle cx="324" cy="230" r="7"/></g>
  <g font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" font-weight="300" fill="#292620" text-anchor="middle"><text x="44" y="309">风暴</text><text x="100" y="309">追问</text><text x="156" y="309">落水</text><text x="212" y="309">同行</text><text x="268" y="309">沉船</text><text x="324" y="309">获救</text></g>
  <text x="368" y="350" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="11" font-weight="300" text-anchor="end" fill="#746E65">讲述推进 →</text>
</svg>
