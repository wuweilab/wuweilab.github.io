<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">故事推进中的吸引力曲线</title>
  <desc id="desc">吸引力随着风暴、追问、落水、同行、沉船和获救六个节点起伏。</desc>
  <rect width="900" height="420" rx="16" fill="#F9F6EF"/>
  <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C65F4B" stop-opacity=".16"/><stop offset="1" stop-color="#C65F4B" stop-opacity="0"/></linearGradient></defs>
  <text x="46" y="54" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="300" fill="#292620">故事推进中的吸引力</text>
  <text x="46" y="82" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" font-weight="300" fill="#746E65">关注点改变，继续阅读的理由也随之改变</text>
  <line x1="70" y1="304" x2="835" y2="304" stroke="#D4CBBD" stroke-width="1"/>
  <path d="M90 258 C150 258 152 222 214 222 S278 130 342 130 S406 224 470 224 S534 157 598 157 S662 254 726 254" fill="none" stroke="#C65F4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M90 258 C150 258 152 222 214 222 S278 130 342 130 S406 224 470 224 S534 157 598 157 S662 254 726 254 L726 304 L90 304 Z" fill="url(#area)"/>
  <g fill="#4F6673" stroke="#F9F6EF" stroke-width="3"><circle cx="90" cy="258" r="8"/><circle cx="214" cy="222" r="8"/><circle cx="342" cy="130" r="8"/><circle cx="470" cy="224" r="8"/><circle cx="598" cy="157" r="8"/><circle cx="726" cy="254" r="8"/></g>
  <g font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" font-weight="300" fill="#292620" text-anchor="middle"><text x="90" y="338">风暴</text><text x="214" y="338">追问</text><text x="342" y="338">落水</text><text x="470" y="338">同行</text><text x="598" y="338">沉船</text><text x="726" y="338">获救</text></g>
  <text x="835" y="388" font-family="Microsoft YaHei UI Light,Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="300" text-anchor="end" fill="#746E65">讲述推进 →</text>
</svg>
