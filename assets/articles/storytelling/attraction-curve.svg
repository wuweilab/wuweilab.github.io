<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">吸引力来自关注点不断更新</title><desc id="desc">横轴为讲述推进，纵轴为继续参与的意愿。曲线仅为创作示意，不代表测量数据或统一反应。</desc>
<rect width="900" height="650" rx="16" fill="#F9F6EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#806B48"/></marker><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78E62" stop-opacity=".20"/><stop offset="1" stop-color="#A78E62" stop-opacity="0"/></linearGradient></defs>
<text x="40" y="50" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#292620">吸引力来自关注点的更新</text>
<text x="40" y="82" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#746E65">创作示意，非实测数据</text>
<line x1="78" y1="150" x2="830" y2="150" stroke="#D4CBBD" stroke-width="2"/>
<line x1="78" y1="275" x2="830" y2="275" stroke="#D4CBBD" stroke-width="2"/>
<line x1="78" y1="400" x2="830" y2="400" stroke="#D4CBBD" stroke-width="2"/>
<line x1="78" y1="112" x2="78" y2="410" stroke="#746E65" stroke-width="2"/>
<line x1="78" y1="410" x2="840" y2="410" stroke="#746E65" stroke-width="2"/>
<text x="83" y="105" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">继续参与的意愿</text>
<path d="M 95 350 C 162.5 350, 162.5 265, 230 265 C 297.5 265, 297.5 130, 365 130 C 432.5 130, 432.5 260, 500 260 C 567.5 260, 567.5 170, 635 170 C 702.5 170, 702.5 345, 770 345 L 770 410 L 95 410 Z" fill="url(#fade)"/>
<path d="M 95 350 C 162.5 350, 162.5 265, 230 265 C 297.5 265, 297.5 130, 365 130 C 432.5 130, 432.5 260, 500 260 C 567.5 260, 567.5 170, 635 170 C 702.5 170, 702.5 345, 770 345" fill="none" stroke="#806B48" stroke-width="4"/>
<circle cx="95" cy="350" r="17" fill="#806B48"/>
<text x="95" y="357" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="230" cy="265" r="17" fill="#806B48"/>
<text x="230" y="272" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="365" cy="130" r="17" fill="#806B48"/>
<text x="365" y="137" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="500" cy="260" r="17" fill="#806B48"/>
<text x="500" y="267" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">4</text>
<circle cx="635" cy="170" r="17" fill="#806B48"/>
<text x="635" y="177" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">5</text>
<circle cx="770" cy="345" r="17" fill="#806B48"/>
<text x="770" y="352" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="830" y="439" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="end" fill="#746E65">讲述推进 →</text>
<text x="40" y="480" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">1  遭遇风暴</text>
<text x="40" y="505" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">能否安全返回</text>
<text x="326" y="480" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">2  问是否相信</text>
<text x="326" y="505" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">他准备做什么</text>
<text x="612" y="480" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">3  孩子落水</text>
<text x="612" y="505" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">为什么这样做</text>
<text x="40" y="553" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">4  父亲跳下</text>
<text x="40" y="578" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">他们怎么办</text>
<text x="326" y="553" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">5  船沉没</text>
<text x="326" y="578" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">能否等到救援</text>
<text x="612" y="553" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#806B48">6  获救与解释</text>
<text x="612" y="578" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#746E65">理解父亲的决定</text>
<text x="40" y="629" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#746E65">情绪强度、危险程度与吸引力并不等同。</text>
</svg>
