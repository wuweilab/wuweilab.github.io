<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">期待与回报轮流发生</title><desc id="desc">提出可理解的问题，支付答案或进展，再从答案中产生新的问题。总目标可以未完成，中途需要有收获。</desc>
<rect width="900" height="450" rx="16" fill="#F9F6EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#806B48"/></marker><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78E62" stop-opacity=".20"/><stop offset="1" stop-color="#A78E62" stop-opacity="0"/></linearGradient></defs>
<text x="40" y="50" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#292620">等待，需要不断得到回报</text>
<rect x="40" y="110" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="165.0" y="150" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#292620">建立期待</text>
<text x="165.0" y="181" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#746E65">我想知道或在意什么</text>
<line x1="298" y1="165" x2="317" y2="165" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="325" y="110" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="450.0" y="150" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#292620">给予回报</text>
<text x="450.0" y="181" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#746E65">答案、进展、笑声或理解</text>
<line x1="583" y1="165" x2="602" y2="165" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="110" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="735.0" y="150" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#292620">产生新问题</text>
<text x="735.0" y="181" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#746E65">下一步为什么值得看</text>
<text x="40" y="289" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="24" font-weight="500" text-anchor="start" fill="#806B48">找到钥匙 → 发现家里有人来过</text>
<text x="40" y="334" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#746E65">旧问题已回答，新问题有了依据。</text>
<text x="40" y="425" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#746E65">总目标未完成，中途也应有收获。</text>
</svg>
