<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" role="img" aria-labelledby="title desc"><title id="title">故事怎样继续往前走</title><desc id="desc">愿望带来行动，结果与预期之间的落差促成调整与新的选择。下一次行动因此改变，而不是仅增加无关意外。</desc>
<rect width="400" height="690" rx="16" fill="#F9F6EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#806B48"/></marker><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78E62" stop-opacity=".20"/><stop offset="1" stop-color="#A78E62" stop-opacity="0"/></linearGradient></defs>
<text x="24" y="38" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#292620">让下一步从上一步长出来</text>
<rect x="36" y="94" width="328" height="83" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="200.0" y="125" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#292620">愿望与代价</text>
<text x="200.0" y="149" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#746E65">得到什么，失去什么</text>
<line x1="200" y1="183" x2="200" y2="204" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="214" width="328" height="83" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="200.0" y="245" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#292620">采取行动</text>
<text x="200.0" y="269" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#746E65">按自己的理解尝试</text>
<line x1="200" y1="303" x2="200" y2="324" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="334" width="328" height="83" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="200.0" y="365" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#292620">结果与预期有落差</text>
<text x="200.0" y="389" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#746E65">新的条件或问题出现</text>
<line x1="200" y1="423" x2="200" y2="444" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="454" width="328" height="83" rx="10" fill="#FFFFFF" stroke="#D4CBBD"/>
<text x="200.0" y="485" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#292620">调整并选择</text>
<text x="200.0" y="509" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#746E65">决定下一步怎样行动</text>
<path d="M 366 496 L 385 496 L 385 250 L 368 250" fill="none" stroke="#806B48" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="610" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#806B48">新的选择，改变下一次行动。</text>
<text x="24" y="640" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#746E65">在压力中，人物逐渐显露性格。</text>
<text x="24" y="665" font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#746E65">落差也可以带来暂时的成功。</text>
</svg>
